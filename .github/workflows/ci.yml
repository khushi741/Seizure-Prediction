name: Seizure Prediction CI

on:
  push:
    branches: [ main, master, honest-seizure-prediction ]
  pull_request:
    branches: [ main, master, honest-seizure-prediction ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy scipy scikit-learn pandas pyyaml fastapi pydantic httpx

      - name: Run Automated Leakage & Isolation Tests
        run: |
          python -m unittest discover -s backend/tests -v

      - name: Verify Baselines Evaluation Pipeline
        run: |
          python backend/evaluate_baselines.py
